{{#extends "base"}}
{{#block "preload"}}<link rel="preload" as="image" href="{{banner_local}}" fetchpriority="high" />{{/block}}
{{#block "main"}}
<header class="collection-hero">
  <img src="{{banner_local}}" width="768" height="430" alt="{{banner_alt}}" fetchpriority="high" decoding="async" />
  <div class="collection-hero-copy container">
    <p class="eyebrow">Alien Studio collection</p>
    <h1>{{name}}</h1>
    <p>{{description}}</p>
  </div>
</header>
<article class="section collection-shell">
  <div class="container collection-content">{{!content}}</div>
</article>
<div class="gallery-lightbox" id="gallery-lightbox" popover="auto" role="dialog" aria-modal="true" aria-label="Full-screen photograph viewer">
  <button class="lightbox-close" type="button" popovertarget="gallery-lightbox" popovertargetaction="hide" aria-label="Close full-screen photograph" autofocus>×</button>
  <button class="lightbox-nav lightbox-previous" type="button" data-gallery-previous aria-label="Previous photograph">←</button>
  <figure class="lightbox-figure">
    <img id="gallery-lightbox-image" src="{{banner_local}}" width="768" height="430" alt="{{banner_alt}}" />
    <figcaption id="gallery-lightbox-caption"></figcaption>
  </figure>
  <button class="lightbox-nav lightbox-next" type="button" data-gallery-next aria-label="Next photograph">→</button>
  <p class="lightbox-count" id="gallery-lightbox-count" aria-live="polite"></p>
</div>
{{/block}}
