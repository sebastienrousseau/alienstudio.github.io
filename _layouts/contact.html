{{#extends "base"}}
{{#block "main"}}
<article class="section page-shell">
  <div class="container page-grid">
    <header><p class="eyebrow">Start a conversation</p><h1>{{name}}</h1><p class="lead">{{description}}</p></header>
    <div>
      <div class="prose rich-prose">{{!content}}</div>
      <form class="contact-form" action="https://formspree.io/f/xjvqprbg" method="post">
        <div><label for="contact-name">Name</label><input id="contact-name" name="name" type="text" autocomplete="name" required /></div>
        <div><label for="contact-email">Email</label><input id="contact-email" name="email" type="email" autocomplete="email" required /></div>
        <div><label for="contact-subject">Subject</label><input id="contact-subject" name="subject" type="text" required /></div>
        <div><label for="contact-message">Message</label><textarea id="contact-message" name="message" rows="7" required></textarea></div>
        <button class="button button-primary" type="submit">Send message</button>
      </form>
    </div>
  </div>
</article>
{{/block}}
